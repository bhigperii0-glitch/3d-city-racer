<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Multiplayer World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Press Start 2P', monospace; touch-action: none; user-select: none; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6); padding: 15px; border: 4px solid #555; font-size: 10px; z-index: 10; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.2), inset -4px -4px 0 rgba(0,0,0,0.4);}
        #ui h3 { margin: 0 0 10px 0; color: #ffeb3b; text-shadow: 2px 2px 0 #000; }
        
        #radar { position: absolute; top: 10px; right: 10px; width: 80px; height: 80px; background: rgba(0,0,0,0.8); border: 4px solid #555; border-radius: 50%; z-index: 10; overflow: hidden;}
        .radar-dot { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); border: 1px solid white;}
        #myRadarDot { background: blue; }

        #speedometer { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.7); padding: 10px 20px; font-size: 20px; z-index: 10; border: 4px solid #555; text-shadow: 2px 2px 0 #000;}
        
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10;}
        .d-pad { display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 5px; pointer-events: auto; }
        .btn { background: #888; color: white; border: 4px solid #333; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4), inset -2px -2px 0 rgba(0,0,0,0.4);}
        .btn:active { background: #555; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.4); }
    </style>
    
    <script src="three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="ui">
        <h3>🌍 Multiplayer</h3>
        <p>Players: <span id="playerCount">1</span></p>
    </div>

    <div id="radar">
        <div id="myRadarDot" class="radar-dot" style="top:50%; left:50%;"></div>
    </div>

    <div id="speedometer">0 KM/H</div>

    <div id="controls">
        <div class="d-pad">
            <div></div>
            <div class="btn" ontouchstart="setMove('forward', true)" ontouchend="setMove('forward', false)" onmousedown="setMove('forward', true)" onmouseup="setMove('forward', false)" onmouseleave="setMove('forward', false)">⬆️</div>
            <div></div>
            <div class="btn" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)" onmousedown="setMove('left', true)" onmouseup="setMove('left', false)" onmouseleave="setMove('left', false)">⬅️</div>
            <div class="btn" ontouchstart="setMove('backward', true)" ontouchend="setMove('backward', false)" onmousedown="setMove('backward', true)" onmouseup="setMove('backward', false)" onmouseleave="setMove('backward', false)">⬇️</div>
            <div class="btn" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)" onmouseleave="setMove('right', false)">➡️</div>
        </div>
    </div>

    <script>
        const socket = io();
        const otherPlayers = {}; 
        let scene, camera, renderer;
        let carMesh;
        
        let speed = 0;
        let carAngle = 0;
        const maxSpeed = 2.0;
        const acceleration = 0.03;
        const friction = 0.02;
        const turnSpeed = 0.04;
        
        window.keys = { forward: false, backward: false, left: false, right: false };

        window.onload = function() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7)); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // --- MINECRAFT WORLD ---
            const grassTex = makeMinecraftGrassTexture();
            const ground = new THREE.Mesh(new THREE.BoxGeometry(500, 2, 500), new THREE.MeshStandardMaterial({ map: grassTex }));
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            const woodMat = new THREE.MeshStandardMaterial({ color: 0x795548 });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
            const cobbleMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            
            for(let i=0; i<60; i++) {
                const bx = Math.random() * 300 - 150;
                const bz = Math.random() * 300 - 150;
                // Keep the center clear so we can see the spawn
                if(Math.abs(bx) < 20 && Math.abs(bz) < 20) continue;

                if(Math.random() > 0.5) {
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), woodMat);
                    trunk.position.set(bx, 3, bz); trunk.castShadow = true; scene.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), leafMat);
                    leaves.position.set(bx, 8, bz); leaves.castShadow = true; scene.add(leaves);
                } else {
                    const h = 10 + Math.random() * 20;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(10, h, 10), cobbleMat);
                    b.position.set(bx, h/2, bz); b.castShadow = true; b.receiveShadow = true; scene.add(b);
                }
            }

            // --- PLAYER CAR ---
            carMesh = new THREE.Group();
            const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 4.5), new THREE.MeshStandardMaterial({ color: 0x1976d2 }));
            chassis.position.y = 0.6; chassis.castShadow = true; carMesh.add(chassis);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            cabin.position.set(0, 1.4, -0.2); cabin.castShadow = true; carMesh.add(cabin);
            carMesh.position.set(0, 0, 0); // Start at center
            scene.add(carMesh);

            // --- MULTIPLAYER LISTENERS ---
            socket.on('currentPlayers', (players) => {
                Object.keys(players).forEach((id) => {
                    if (id !== socket.id) addOtherPlayer(players[id]);
                });
                document.getElementById('playerCount').innerText = Object.keys(players).length;
            });

            socket.on('newPlayer', (playerInfo) => {
                addOtherPlayer(playerInfo);
                document.getElementById('playerCount').innerText = Object.keys(otherPlayers).length + 1;
            });

            socket.on('playerMoved', (playerInfo) => {
                if (otherPlayers[playerInfo.id]) {
                    otherPlayers[playerInfo.id].targetX = playerInfo.x;
                    otherPlayers[playerInfo.id].targetZ = playerInfo.z;
                    otherPlayers[playerInfo.id].targetAngle = playerInfo.angle;
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id].mesh);
                    if(otherPlayers[id].radarDot) otherPlayers[id].radarDot.remove();
                    delete otherPlayers[id];
                    document.getElementById('playerCount').innerText = Object.keys(otherPlayers).length + 1;
                }
            });

            animate();
        };

        function makeMinecraftGrassTexture() {
            const c = document.createElement('canvas'); c.width = 64; c.height = 64;
            const ctx = c.getContext('2d'); 
            ctx.fillStyle = '#388e3c'; ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = '#4caf50';
            for(let i=0; i<50; i++) { ctx.fillRect(Math.random()*64, Math.random()*64, 4, 4); }
            const tex = new THREE.CanvasTexture(c); 
            tex.magFilter = THREE.NearestFilter; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(100, 100);
            return tex;
        }

        function createNameTag(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const context = canvas.getContext('2d');
            context.font = "24px 'Press Start 2P'";
            context.fillStyle = "rgba(0,0,0,0.6)";
            context.fillRect(0,0,256,64);
            context.fillStyle = "yellow";
            context.textAlign = "center";
            context.fillText(name, 128, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(8, 2, 1);
            return sprite;
        }

        function addOtherPlayer(playerInfo) {
            const group = new THREE.Group();
            const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 4.5), new THREE.MeshStandardMaterial({ color: playerInfo.color }));
            chassis.position.y = 0.6; group.add(chassis);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            cabin.position.set(0, 1.4, -0.2); group.add(cabin);

            const nameTag = createNameTag(playerInfo.name);
            nameTag.position.set(0, 3.5, 0);
            group.add(nameTag);

            group.position.set(playerInfo.x, 0, playerInfo.z);
            group.rotation.y = playerInfo.angle;
            scene.add(group);
            
            const dot = document.createElement('div');
            dot.className = 'radar-dot';
            dot.style.top = '50%';
            dot.style.left = '50%';
            document.getElementById('radar').appendChild(dot);

            otherPlayers[playerInfo.id] = { mesh: group, targetX: playerInfo.x, targetZ: playerInfo.z, targetAngle: playerInfo.angle, radarDot: dot };
        }

        window.setMove = function(dir, isPressed) { keys[dir] = isPressed; }

        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (keys['forward']) speed += acceleration;
            else if (keys['backward']) speed -= acceleration;
            else speed *= (1 - friction); 

            speed = Math.max(-maxSpeed/2, Math.min(maxSpeed, speed));

            if (Math.abs(speed) > 0.05) {
                if (keys['left']) carAngle += turnSpeed;
                if (keys['right']) carAngle -= turnSpeed;
            }

            carMesh.position.x -= Math.sin(carAngle) * speed;
            carMesh.position.z -= Math.cos(carAngle) * speed;
            carMesh.rotation.y = carAngle;

            socket.emit('playerMovement', { x: carMesh.position.x, z: carMesh.position.z, angle: carAngle });

            Object.keys(otherPlayers).forEach(id => {
                const p = otherPlayers[id];
                p.mesh.position.x += (p.targetX - p.mesh.position.x) * 0.2;
                p.mesh.position.z += (p.targetZ - p.mesh.position.z) * 0.2;
                p.mesh.rotation.y = p.targetAngle;

                // FIXED RADAR MATH
                const dx = p.targetX - carMesh.position.x;
                const dz = p.targetZ - carMesh.position.z;
                
                // Map relative position to radar (radar is 80x80, center is 40,40)
                let rX = 40 + (dx * 1.5);
                let rZ = 40 + (dz * 1.5);
                
                // Keep dot inside the radar circle
                if (rX > 75) rX = 75;
                if (rX < 5) rX = 5;
                if (rZ > 75) rZ = 75;
                if (rZ < 5) rZ = 5;

                p.radarDot.style.left = `${rX}px`;
                p.radarDot.style.top = `${rZ}px`;
            });

            const camOffset = { x: Math.sin(carAngle) * 15, y: 8, z: Math.cos(carAngle) * 15 };
            camera.position.x += (carMesh.position.x + camOffset.x - camera.position.x) * 0.1;
            camera.position.y += (carMesh.position.y + camOffset.y - camera.position.y) * 0.1;
            camera.position.z += (carMesh.position.z + camOffset.z - camera.position.z) * 0.1;
            camera.lookAt(carMesh.position.x, carMesh.position.y + 1, carMesh.position.z);

            let kmh = Math.floor(Math.abs(speed) * 120);
            document.getElementById('speedometer').innerText = `${kmh} KM/H`;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
