<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA Minecraft: Endless World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; overflow: hidden; background-color: #78A7FF; font-family: 'Press Start 2P', monospace; touch-action: none; user-select: none; }
        
        /* UI */
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 4px solid #555; font-size: 10px; z-index: 10; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.2); }
        #ui h3 { margin: 0 0 10px 0; color: #ffeb3b; text-shadow: 2px 2px 0 #000; }
        .money { color: #4caf50; font-size: 14px; }
        #missionText { color: #ff5252; font-weight: bold; margin-top: 10px; font-size: 10px; line-height: 1.5;}
        #resetBtn { background: #333; color: #ff5252; border: 2px solid #555; font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 5px; margin-top: 10px; cursor: pointer; display: block; width: 100%;}
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 30px; font-weight: bold; pointer-events: none; z-index: 5; opacity: 0.7; text-shadow: 0 0 5px black;}

        /* VIRTUAL JOYSTICK */
        #joystick-container { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; z-index: 10; display: flex; justify-content: center; align-items: center;}
        #joystick-knob { width: 60px; height: 60px; background: rgba(255,255,255,0.6); border-radius: 50%; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.8); transition: transform 0.1s; }

        /* ACTIONS */
        .action-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; z-index: 10;}
        .action-btn { width: 70px; height: 70px; border-radius: 50%; color: white; border: 4px solid #222; font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: bold; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; text-align: center;}
        #jumpBtn { background: #1976d2; }
        #actionBtn { background: #d32f2f; }
        #mineBtn { background: #ff9800; width: 55px; height: 55px; }
    </style>
    
    <script src="three.min.js"></script>
</head>
<body>
    <div id="crosshair">+</div>

    <div id="ui">
        <h3>⛏️ Endless MC</h3>
        <p>Cash: <span class="money" id="money">$0</span></p>
        <p id="missionText">Mission: Find the red target!</p>
        <button id="resetBtn" onclick="resetWorld()">RESET WORLD</button>
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div class="action-container">
        <button id="mineBtn" class="action-btn" onclick="mineBlock()">MINE</button>
        <button id="jumpBtn" class="action-btn" onclick="jump()">JUMP</button>
        <button id="actionBtn" class="action-btn" onclick="doAction()">KILL</button>
    </div>

    <script>
        let scene, camera, renderer, raycaster;
        let player, playerAngle = 0;
        let money = 0;
        let targetNPC, houseDoor;
        let isGrounded = false;
        let velocityY = 0;
        const gravity = -35;
        const jumpForce = 14;
        
        // Performance Optimization
        const blockSize = 4;
        const CHUNK_SIZE = 6; 
        const RENDER_DISTANCE = 2; 
        let activeChunks = {};
        let allBlocks = []; 

        let missionComplete = false;
        let minedBlocks = new Set(JSON.parse(localStorage.getItem('minedBlocks')) || []);

        // JOYSTICK VARIABLES
        let joyMoveX = 0;
        let joyMoveZ = 0;

        function resetWorld() {
            localStorage.removeItem('minedBlocks');
            location.reload();
        }

        function createMCTexture(baseColor, noiseColor) {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = noiseColor;
            for(let i=0; i<200; i++) { ctx.fillRect(Math.floor(Math.random()*64), Math.floor(Math.random()*64), 4, 4); }
            const tex = new THREE.CanvasTexture(canvas); 
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function createFaceTexture(skinColor, hairColor) {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = skinColor; ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = hairColor; ctx.fillRect(0, 0, 64, 20); ctx.fillRect(0, 20, 12, 15); ctx.fillRect(52, 20, 12, 15); 
            ctx.fillStyle = '#ffffff'; ctx.fillRect(14, 28, 12, 12); ctx.fillRect(38, 28, 12, 12);
            ctx.fillStyle = '#000000'; ctx.fillRect(18, 32, 4, 4); ctx.fillRect(42, 32, 4, 4);
            ctx.fillStyle = '#d7a391'; ctx.fillRect(30, 36, 4, 6);
            ctx.fillStyle = '#a33'; ctx.fillRect(24, 48, 16, 4);
            const tex = new THREE.CanvasTexture(canvas); tex.magFilter = THREE.NearestFilter; return tex;
        }

        const texGrassTop = createMCTexture('#5A9E3F', '#4B8832');
        const texGrassSide = createMCTexture('#795548', '#5D4037');
        const texStone = createMCTexture('#888888', '#666666');
        const texWood = createMCTexture('#5D4037', '#3E2723');
        const texLeaves = createMCTexture('#4CAF50', '#2E7D32');
        const faceTexSteve = createFaceTexture('#ffccbc', '#3E2723');
        const faceTexTarget = createFaceTexture('#8d5524', '#000000');

        window.onload = function() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78A7FF); 
            scene.fog = new THREE.Fog(0x78A7FF, 40, 100); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Start camera behind the player
            camera.position.set(0, 80, -20); 
            camera.lookAt(0, 60, 20);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.BasicShadowMap; 
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7)); 
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 512; 
            dirLight.shadow.mapSize.height = 512;
            scene.add(dirLight);

            raycaster = new THREE.Raycaster();
            raycaster.far = 20; 

            createPlayer();
            
            setTimeout(() => {
                createTarget(10, -10, 2);
                buildHouse(0, 0);
            }, 1000);

            setupJoystick();
            animate();
        };

        // --- JOYSTICK LOGIC ---
        function setupJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let isDragging = false;
            let center = { x: 0, y: 0 };

            container.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDragging = true;
                const rect = container.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches[0];
                let dx = touch.clientX - center.x;
                let dy = touch.clientY - center.y;
                
                const maxDist = 30;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                joyMoveX = dx / maxDist;
                joyMoveZ = -dy / maxDist; 
            });

            document.addEventListener('touchend', () => {
                isDragging = false;
                knob.style.transform = `translate(0px, 0px)`;
                joyMoveX = 0;
                joyMoveZ = 0;
            });
        }

        function generateChunk(cx, cz) {
            const chunkGroup = new THREE.Group();
            const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const worldX = cx * CHUNK_SIZE + x;
                    const worldZ = cz * CHUNK_SIZE + z;
                    let height = Math.floor(Math.sin(worldX / 5) * 1.5 + Math.cos(worldZ / 5) * 1.5) + 2;
                    
                    for (let y = height; y >= height - 1; y--) {
                        const bx = worldX * blockSize;
                        const by = y * blockSize;
                        const bz = worldZ * blockSize;
                        
                        const blockId = `${bx.toFixed(1)}_${by.toFixed(1)}_${bz.toFixed(1)}`;
                        if (minedBlocks.has(blockId)) continue;

                        let mat;
                        if (y === height) {
                            mat = [ new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassTop }), new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }) ];
                        } else {
                            mat = new THREE.MeshStandardMaterial({ map: texStone });
                        }

                        const block = new THREE.Mesh(geometry, mat);
                        block.position.set(bx, by, bz);
                        block.receiveShadow = false;
                        block.castShadow = false; 
                        chunkGroup.add(block);

                        if (y === height) {
                            allBlocks.push({ mesh: block, x: bx, y: by, z: bz, id: blockId });
                        }
                    }
                }
            }

            scene.add(chunkGroup);
            activeChunks[`${cx},${cz}`] = chunkGroup;
        }

        function updateChunks(px, pz) {
            const currentCX = Math.floor(px / (CHUNK_SIZE * blockSize));
            const currentCZ = Math.floor(pz / (CHUNK_SIZE * blockSize));

            for (let x = currentCX - RENDER_DISTANCE; x <= currentCX + RENDER_DISTANCE; x++) {
                for (let z = currentCZ - RENDER_DISTANCE; z <= currentCZ + RENDER_DISTANCE; z++) {
                    const key = `${x},${z}`;
                    if (!activeChunks[key]) generateChunk(x, z);
                }
            }

            for (let key in activeChunks) {
                const [cx, cz] = key.split(',').map(Number);
                if (Math.abs(cx - currentCX) > RENDER_DISTANCE + 1 || Math.abs(cz - currentCZ) > RENDER_DISTANCE + 1) {
                    scene.remove(activeChunks[key]);
                    delete activeChunks[key];
                    allBlocks = allBlocks.filter(b => Math.abs(b.x/ (CHUNK_SIZE*blockSize) - currentCX) <= RENDER_DISTANCE + 1);
                }
            }
        }

        function buildHouse(x, z) {
            const houseMat = new THREE.MeshStandardMaterial({ map: texWood });
            const base = new THREE.Mesh(new THREE.BoxGeometry(blockSize*4, blockSize*3, blockSize*4), houseMat);
            base.position.set(x, blockSize*1.5, z); base.castShadow = true; base.receiveShadow = true; scene.add(base);
            const roof = new THREE.Mesh(new THREE.BoxGeometry(blockSize*5, blockSize*1, blockSize*5), new THREE.MeshStandardMaterial({ map: texStone }));
            roof.position.set(x, blockSize*3.5, z); roof.castShadow = true; scene.add(roof);

            houseDoor = new THREE.Mesh(new THREE.BoxGeometry(blockSize*1.5, blockSize*2, 0.5), new THREE.MeshBasicMaterial({ color: 0x4caf50 }));
            houseDoor.position.set(x, blockSize*1, z + blockSize*2); scene.add(houseDoor);
        }

        function buildHumanoid(shirtColor, faceTexture) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccbc });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.6, blockSize*0.8, blockSize*0.4), shirtMat);
            body.position.y = blockSize*0.5; body.castShadow = true; group.add(body);
            
            const headMats = [
                new THREE.MeshStandardMaterial({ color: 0xffccbc }), new THREE.MeshStandardMaterial({ color: 0xffccbc }),
                new THREE.MeshStandardMaterial({ color: 0xffccbc }), new THREE.MeshStandardMaterial({ color: 0xffccbc }),
                new THREE.MeshStandardMaterial({ map: faceTexture }), new THREE.MeshStandardMaterial({ color: 0x3E2723 })
            ];
            const head = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.5, blockSize*0.5, blockSize*0.5), headMats);
            head.position.y = blockSize*1.15; head.castShadow = true; group.add(head);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.25, blockSize*0.8, blockSize*0.25), skinMat);
            armL.position.set(-blockSize*0.45, blockSize*0.5, 0); group.add(armL);
            const armR = armL.clone(); armR.position.x = blockSize*0.45; group.add(armR);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.3, blockSize*0.8, blockSize*0.3), pantsMat);
            legL.position.set(-blockSize*0.2, -blockSize*0.4, 0); group.add(legL);
            const legR = legL.clone(); legR.position.x = blockSize*0.2; group.add(legR);

            group.userData = { armL, armR, legL, legR };
            return group;
        }

        function createPlayer() {
            player = buildHumanoid(0x1976d2, faceTexSteve); 
            player.position.set(0, 60, 20); 
            scene.add(player);
        }

        function createTarget(x, z, yHeight) {
            targetNPC = buildHumanoid(0xd32f2f, faceTexTarget); 
            targetNPC.position.set(x * blockSize, yHeight * blockSize + 1, z * blockSize); 
            scene.add(targetNPC);
        }

        window.jump = function() { if(isGrounded) { velocityY = jumpForce; isGrounded = false; } }

        window.mineBlock = function() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); 
            const intersects = raycaster.intersectObjects(allBlocks.map(b => b.mesh));
            
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const blockData = allBlocks.find(b => b.mesh === hitMesh);
                
                if(blockData) {
                    scene.remove(hitMesh);
                    minedBlocks.add(blockData.id); 
                    localStorage.setItem('minedBlocks', JSON.stringify([...minedBlocks])); 
                    allBlocks = allBlocks.filter(b => b.mesh !== hitMesh);
                }
            }
        }

        function doAction() {
            if(!targetNPC) return;
            const distToTarget = Math.hypot(player.position.x - targetNPC.position.x, player.position.z - targetNPC.position.z);
            const distToDoor = houseDoor ? Math.hypot(player.position.x - houseDoor.position.x, player.position.z - houseDoor.position.z) : 999;

            if (distToTarget < 6 && !missionComplete) {
                scene.remove(targetNPC);
                money += 500;
                document.getElementById('money').innerText = "$" + money;
                document.getElementById('missionText').innerText = "Mission Complete! You earned $500.";
                document.getElementById('missionText').style.color = "#4caf50";
                missionComplete = true;
            } else if (distToDoor < 6) {
                alert("You entered your house.");
                player.position.set(0, blockSize * 5, 0); 
            } else {
                alert("Walk closer to the red target to kill them!");
            }
        }

        const clock = new THREE.Clock();
        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updateChunks(player.position.x, player.position.z);

            let moveSpeed = 25 * delta; 
            let isMoving = false;

            if (Math.abs(joyMoveX) > 0.1 || Math.abs(joyMoveZ) > 0.1) {
                isMoving = true;
                
                let targetAngle = Math.atan2(joyMoveX, joyMoveZ);
                
                let angleDiff = targetAngle - playerAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                playerAngle += angleDiff * 0.2;

                let forwardX = Math.sin(playerAngle);
                let forwardZ = Math.cos(playerAngle);
                player.position.x += forwardX * moveSpeed;
                player.position.z += forwardZ * moveSpeed;
            }

            player.rotation.y = playerAngle;

            velocityY += gravity * delta;
            player.position.y += velocityY * delta;

            let floorY = -20; 
            allBlocks.forEach(block => {
                if (Math.abs(player.position.x - block.x) < blockSize/1.2 && Math.abs(player.position.z - block.z) < blockSize/1.2) {
                    if (block.y > floorY) floorY = block.y;
                }
            });

            const playerHeightOffset = blockSize * 1.0; 
            const targetGroundY = floorY + blockSize/2 + playerHeightOffset;

            if (player.position.y <= targetGroundY) {
                player.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            if (isMoving && isGrounded) {
                walkCycle += delta * 15;
                player.userData.legL.rotation.x = Math.sin(walkCycle) * 0.8;
                player.userData.legR.rotation.x = -Math.sin(walkCycle) * 0.8;
                player.userData.armL.rotation.x = -Math.sin(walkCycle) * 0.8;
                player.userData.armR.rotation.x = Math.sin(walkCycle) * 0.8;
            } else {
                player.userData.legL.rotation.x = 0;
                player.userData.legR.rotation.x = 0;
                player.userData.armL.rotation.x = 0;
                player.userData.armR.rotation.x = 0;
            }

            // --- CAMERA FIX: BEHIND THE PLAYER (Back of head view) ---
            const camOffset = { x: Math.sin(playerAngle) * 25, y: 12, z: Math.cos(playerAngle) * 25 };
            
            camera.position.x += (player.position.x + camOffset.x - camera.position.x) * 0.15;
            camera.position.y += (player.position.y + camOffset.y - camera.position.y) * 0.15;
            camera.position.z += (player.position.z + camOffset.z - camera.position.z) * 0.15;
            
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
