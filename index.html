<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA: Minecraft Block City</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Press Start 2P', monospace; touch-action: none; user-select: none; }
        
        /* UI */
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 4px solid #555; font-size: 10px; z-index: 10; display: block; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.2); }
        #ui h3 { margin: 0 0 10px 0; color: #ffeb3b; text-shadow: 2px 2px 0 #000; }
        .money { color: #4caf50; font-size: 14px; }
        #missionText { color: #ff5252; font-weight: bold; margin-top: 10px; font-size: 10px; line-height: 1.5;}

        /* Controls */
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10;}
        
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; pointer-events: auto; }
        .btn { background: #888; color: white; border: 4px solid #333; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4);}
        .btn:active { background: #555; }
        
        #actionBtn { position: absolute; bottom: 20px; right: 20px; width: 90px; height: 90px; border-radius: 50%; background: #d32f2f; color: white; border: 4px solid #b71c1c; font-family: 'Press Start 2P', monospace; font-size: 12px; font-weight: bold; pointer-events: auto; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; text-align: center;}
        #actionBtn:active { background: #b71c1c; }
    </style>
    
    <script src="three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h3>🌆 Block City</h3>
        <p>Cash: <span class="money" id="money">$0</span></p>
        <p id="missionText">Mission: Find the red target and eliminate them!</p>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div></div>
            <div class="btn" ontouchstart="setMove('forward', true)" ontouchend="setMove('forward', false)" onmousedown="setMove('forward', true)" onmouseup="setMove('forward', false)">⬆️</div>
            <div></div>
            <div class="btn" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)" onmousedown="setMove('left', true)" onmouseup="setMove('left', false)">⬅️</div>
            <div class="btn" ontouchstart="setMove('backward', true)" ontouchend="setMove('backward', false)" onmousedown="setMove('backward', true)" onmouseup="setMove('backward', false)">⬇️</div>
            <div class="btn" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)">➡️</div>
        </div>
    </div>
    <button id="actionBtn" onclick="doAction()">ACTION</button>

    <script>
        let scene, camera, renderer;
        let player, playerAngle = 0, playerSpeed = 0;
        let money = 0;
        let targetNPC, houseDoor;
        let keys = { forward: false, backward: false, left: false, right: false };
        let walls = []; // For collision
        
        // Game State
        let missionComplete = false;

        window.onload = function() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78A7FF); 
            scene.fog = new THREE.Fog(0x78A7FF, 50, 200);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground (Massive solid green floor)
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x5A9E3F });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Roads
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const roadH = new THREE.Mesh(new THREE.PlaneGeometry(500, 30), roadMat);
            roadH.rotation.x = -Math.PI / 2; roadH.position.y = 0.1; scene.add(roadH);
            const roadV = new THREE.Mesh(new THREE.PlaneGeometry(30, 500), roadMat);
            roadV.rotation.x = -Math.PI / 2; roadV.position.y = 0.1; scene.add(roadV);

            // Build the City
            createBuilding(-40, -40, 30, 40, 30, 0x607d8b); // Skyscraper
            createBuilding(40, -40, 25, 20, 25, 0x90a4ae);  // Office
            createBuilding(-40, 40, 20, 15, 20, 0xd7ccc8);  // Bank

            // Player's House
            createBuilding(40, 40, 20, 10, 20, 0xf5f5dc);
            // House Door (Interactive)
            const doorMat = new THREE.MeshBasicMaterial({ color: 0x4caf50 });
            houseDoor = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 1), doorMat);
            houseDoor.position.set(40, 3, 30); // Front of the house
            scene.add(houseDoor);

            // Create Player (Steve)
            createPlayer();

            // Create Mission Target (Red Villager)
            createTarget(20, -20);

            animate();
        };

        function createBuilding(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const bldg = new THREE.Mesh(geo, mat);
            bldg.position.set(x, h/2, z);
            bldg.castShadow = true;
            bldg.receiveShadow = true;
            scene.add(bldg);
            
            // Add to collision array
            walls.push({ x, z, w, d });
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 1), new THREE.MeshStandardMaterial({ color: 0x1976d2 }));
            body.position.y = 2; body.castShadow = true; player.add(body);
            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xffccbc }));
            head.position.y = 4.25; head.castShadow = true; player.add(head);
            // Legs
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            legL.position.set(-0.5, 1, 0); player.add(legL);
            const legR = legL.clone(); legR.position.x = 0.5; player.add(legR);

            player.position.set(0, 0, 10);
            scene.add(player);
        }

        function createTarget(x, z) {
            targetNPC = new THREE.Group();
            
            // Red Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 1), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
            body.position.y = 2; body.castShadow = true; targetNPC.add(body);
            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xffccbc }));
            head.position.y = 4.25; head.castShadow = true; targetNPC.add(head);
            
            // Exclamation mark
            const mark = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 0.5), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
            mark.position.y = 6; targetNPC.add(mark);

            targetNPC.position.set(x, 0, z);
            scene.add(targetNPC);
        }

        window.setMove = function(dir, isPressed) { keys[dir] = isPressed; }

        function doAction() {
            const distToTarget = Math.hypot(player.position.x - targetNPC.position.x, player.position.z - targetNPC.position.z);
            const distToDoor = Math.hypot(player.position.x - houseDoor.position.x, player.position.z - houseDoor.position.z);

            if (distToTarget < 3 && !missionComplete) {
                // KILL TARGET
                scene.remove(targetNPC);
                money += 500;
                document.getElementById('money').innerText = "$" + money;
                document.getElementById('missionText').innerText = "Mission Complete! You earned $500.";
                document.getElementById('missionText').style.color = "#4caf50";
                missionComplete = true;
            } else if (distToDoor < 4) {
                // ENTER HOUSE
                alert("You entered your house and slept. Health restored!");
                player.position.set(40, 0, 40); // Teleport inside house
            } else {
                alert("Nothing to do here. Find the red target!");
            }
        }

        const clock = new THREE.Clock();
        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movement Physics
            let moveSpeed = 10 * delta;
            let isMoving = false;

            if (keys['forward']) { 
                player.position.x -= Math.sin(playerAngle) * moveSpeed; 
                player.position.z -= Math.cos(playerAngle) * moveSpeed; 
                isMoving = true;
            }
            if (keys['backward']) { 
                player.position.x += Math.sin(playerAngle) * moveSpeed; 
                player.position.z += Math.cos(playerAngle) * moveSpeed; 
                isMoving = true;
            }
            if (keys['left']) { playerAngle += 0.05; isMoving = true; }
            if (keys['right']) { playerAngle -= 0.05; isMoving = true; }

            player.rotation.y = playerAngle;

            // Simple Walk Animation (Bobbing)
            if (isMoving) {
                walkCycle += delta * 10;
                player.children[2].rotation.x = Math.sin(walkCycle) * 0.5; // Left leg
                player.children[3].rotation.x = -Math.sin(walkCycle) * 0.5; // Right leg
            } else {
                player.children[2].rotation.x = 0;
                player.children[3].rotation.x = 0;
            }

            // Simple Wall Collision
            walls.forEach(wall => {
                const buffer = 1.5;
                if (player.position.x > wall.x - wall.w/2 - buffer && player.position.x < wall.x + wall.w/2 + buffer &&
                    player.position.z > wall.z - wall.d/2 - buffer && player.position.z < wall.z + wall.d/2 + buffer) {
                    // Push player out (very simple)
                    player.position.z += Math.cos(playerAngle) * moveSpeed; 
                }
            });

            // Camera Follow (Third Person)
            const camOffset = { x: Math.sin(playerAngle) * 12, y: 8, z: Math.cos(playerAngle) * 12 };
            camera.position.x += (player.position.x + camOffset.x - camera.position.x) * 0.1;
            camera.position.y += (player.position.y + camOffset.y - camera.position.y) * 0.1;
            camera.position.z += (player.position.z + camOffset.z - camera.position.z) * 0.1;
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
