<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA: Minecraft Block City</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Press Start 2P', monospace; touch-action: none; user-select: none; }
        
        /* UI */
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 4px solid #555; font-size: 10px; z-index: 10; display: block; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.2); }
        #ui h3 { margin: 0 0 10px 0; color: #ffeb3b; text-shadow: 2px 2px 0 #000; }
        .money { color: #4caf50; font-size: 14px; }
        #missionText { color: #ff5252; font-weight: bold; margin-top: 10px; font-size: 10px; line-height: 1.5;}

        /* Controls */
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10;}
        
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; pointer-events: auto; }
        .btn { background: #888; color: white; border: 4px solid #333; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4);}
        .btn:active { background: #555; }
        
        #actionBtn { position: absolute; bottom: 20px; right: 20px; width: 90px; height: 90px; border-radius: 50%; background: #d32f2f; color: white; border: 4px solid #b71c1c; font-family: 'Press Start 2P', monospace; font-size: 12px; font-weight: bold; pointer-events: auto; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; text-align: center;}
        #actionBtn:active { background: #b71c1c; }
    </style>
    
    <script src="three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h3>⛏️ Block City</h3>
        <p>Cash: <span class="money" id="money">$0</span></p>
        <p id="missionText">Mission: Find the red target on the hills and eliminate them!</p>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div></div>
            <div class="btn" ontouchstart="setMove('forward', true)" ontouchend="setMove('forward', false)" onmousedown="setMove('forward', true)" onmouseup="setMove('forward', false)">⬆️</div>
            <div></div>
            <div class="btn" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)" onmousedown="setMove('left', true)" onmouseup="setMove('left', false)">⬅️</div>
            <div class="btn" ontouchstart="setMove('backward', true)" ontouchend="setMove('backward', false)" onmousedown="setMove('backward', true)" onmouseup="setMove('backward', false)">⬇️</div>
            <div class="btn" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)">➡️</div>
        </div>
    </div>
    <button id="actionBtn" onclick="doAction()">KILL</button>

    <script>
        let scene, camera, renderer;
        let player, playerAngle = 0;
        let money = 0;
        let targetNPC, houseDoor;
        let keys = { forward: false, backward: false, left: false, right: false };
        
        // Physics
        let velocityY = 0;
        let isGrounded = false;
        const gravity = -30;
        const jumpForce = 12;
        
        // World Data
        const blockSize = 4; // Size of each Minecraft block
        const worldSize = 20; // 20x20 blocks
        let worldBlocks = []; // For collision detection

        // Game State
        let missionComplete = false;

        // --- TEXTURES ---
        function createMCTexture(baseColor, noiseColor) {
            const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = noiseColor;
            for(let i=0; i<50; i++) { ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2); }
            const tex = new THREE.CanvasTexture(canvas); 
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrass = createMCTexture('#5A9E3F', '#4B8832');
        const texDirt = createMCTexture('#795548', '#5D4037');
        const texStone = createMCTexture('#888888', '#666666');
        const texWood = createMCTexture('#5D4037', '#3E2723');
        const texLeaves = createMCTexture('#4CAF50', '#2E7D32');

        window.onload = function() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78A7FF); 
            scene.fog = new THREE.Fog(0x78A7FF, 80, 180);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
            dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
            scene.add(dirLight);

            generateTerrain();
            createPlayer();
            
            // Spawn Target on a hill
            createTarget(15, -15, 2);

            animate();
        };

        function generateTerrain() {
            const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            
            for (let x = -worldSize; x < worldSize; x++) {
                for (let z = -worldSize; z < worldSize; z++) {
                    // Create rolling hills using Sine waves
                    let height = Math.floor(Math.sin(x / 3) * 2 + Math.cos(z / 3) * 2) + 3;
                    
                    // Build a pillar of blocks
                    for (let y = 0; y <= height; y++) {
                        let mat;
                        if (y === height) mat = new THREE.MeshStandardMaterial({ map: texGrass }); // Top block
                        else if (y > height - 2) mat = new THREE.MeshStandardMaterial({ map: texDirt }); // Dirt below grass
                        else mat = new THREE.MeshStandardMaterial({ map: texStone }); // Stone below dirt

                        const block = new THREE.Mesh(geometry, mat);
                        block.position.set(x * blockSize, y * blockSize, z * blockSize);
                        block.receiveShadow = true;
                        block.castShadow = true;
                        scene.add(block);

                        // Add top blocks to collision array
                        if (y === height) {
                            worldBlocks.push({ x: x * blockSize, y: y * blockSize, z: z * blockSize });
                        }
                    }

                    // Spawn Trees randomly on grass
                    if (Math.random() < 0.05 && height > 2) {
                        createTree(x * blockSize, (height + 1) * blockSize, z * blockSize);
                    }
                }
            }

            // Build Player House
            buildHouse(0, 0);
        }

        function createTree(x, y, z) {
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize*3, blockSize), new THREE.MeshStandardMaterial({ map: texWood }));
            trunk.position.set(x, y + blockSize, z);
            trunk.castShadow = true; scene.add(trunk);

            const leaves = new THREE.Mesh(new THREE.BoxGeometry(blockSize*2.5, blockSize*2.5, blockSize*2.5), new THREE.MeshStandardMaterial({ map: texLeaves }));
            leaves.position.set(x, y + blockSize*3, z);
            leaves.castShadow = true; scene.add(leaves);
        }

        function buildHouse(x, z) {
            const houseMat = new THREE.MeshStandardMaterial({ map: texWood });
            const roofMat = new THREE.MeshStandardMaterial({ map: texStone });
            
            // Base
            const base = new THREE.Mesh(new THREE.BoxGeometry(blockSize*4, blockSize*3, blockSize*4), houseMat);
            base.position.set(x, blockSize*1.5, z);
            base.castShadow = true; base.receiveShadow = true; scene.add(base);

            // Roof
            const roof = new THREE.Mesh(new THREE.BoxGeometry(blockSize*5, blockSize*1, blockSize*5), roofMat);
            roof.position.set(x, blockSize*3.5, z);
            roof.castShadow = true; scene.add(roof);

            // Door
            houseDoor = new THREE.Mesh(new THREE.BoxGeometry(blockSize*1.5, blockSize*2, 0.5), new THREE.MeshBasicMaterial({ color: 0x4caf50 }));
            houseDoor.position.set(x, blockSize*1, z + blockSize*2);
            scene.add(houseDoor);
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.6, blockSize*0.8, blockSize*0.4), new THREE.MeshStandardMaterial({ color: 0x1976d2 }));
            body.position.y = blockSize*0.5; body.castShadow = true; player.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.5, blockSize*0.5, blockSize*0.5), new THREE.MeshStandardMaterial({ color: 0xffccbc }));
            head.position.y = blockSize*1.1; head.castShadow = true; player.add(head);
            
            player.position.set(0, blockSize*4, blockSize*5); // Start above ground
            scene.add(player);
        }

        function createTarget(x, z, yHeight) {
            targetNPC = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.6, blockSize*0.8, blockSize*0.4), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
            body.position.y = blockSize*0.5; body.castShadow = true; targetNPC.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(blockSize*0.5, blockSize*0.5, blockSize*0.5), new THREE.MeshStandardMaterial({ color: 0xffccbc }));
            head.position.y = blockSize*1.1; head.castShadow = true; targetNPC.add(head);
            
            targetNPC.position.set(x * blockSize, yHeight * blockSize + 1, z * blockSize);
            scene.add(targetNPC);
        }

        window.setMove = function(dir, isPressed) { keys[dir] = isPressed; }

        function doAction() {
            const distToTarget = Math.hypot(player.position.x - targetNPC.position.x, player.position.z - targetNPC.position.z);
            const distToDoor = Math.hypot(player.position.x - houseDoor.position.x, player.position.z - houseDoor.position.z);

            if (distToTarget < 6 && !missionComplete) {
                scene.remove(targetNPC);
                money += 500;
                document.getElementById('money').innerText = "$" + money;
                document.getElementById('missionText').innerText = "Mission Complete! You earned $500.";
                document.getElementById('missionText').style.color = "#4caf50";
                missionComplete = true;
            } else if (distToDoor < 6) {
                alert("You entered your house and rested.");
                player.position.set(0, blockSize * 5, 0); // Teleport inside house
            } else {
                alert("Nothing to do here. Find the red target on the hills!");
            }
        }

        const clock = new THREE.Clock();
        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movement
            let moveSpeed = 15 * delta;
            let isMoving = false;
            let moveX = 0, moveZ = 0;

            if (keys['forward']) { 
                moveX -= Math.sin(playerAngle) * moveSpeed; 
                moveZ -= Math.cos(playerAngle) * moveSpeed; 
                isMoving = true;
            }
            if (keys['backward']) { 
                moveX += Math.sin(playerAngle) * moveSpeed; 
                moveZ += Math.cos(playerAngle) * moveSpeed; 
                isMoving = true;
            }
            if (keys['left']) { playerAngle += 0.05; isMoving = true; }
            if (keys['right']) { playerAngle -= 0.05; isMoving = true; }

            // Gravity & Jumping
            velocityY += gravity * delta;
            player.position.y += velocityY * delta;

            // Terrain Collision (Find the highest block below the player)
            let floorY = 0;
            worldBlocks.forEach(block => {
                // If player is above this block in X and Z
                if (Math.abs(player.position.x - block.x) < blockSize/1.5 && Math.abs(player.position.z - block.z) < blockSize/1.5) {
                    if (block.y > floorY) floorY = block.y;
                }
            });

            // Land on ground
            const playerHeightOffset = blockSize * 1.5; // Distance from feet to center
            if (player.position.y <= floorY + blockSize/2 + playerHeightOffset) {
                player.position.y = floorY + blockSize/2 + playerHeightOffset;
                velocityY = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            // Apply X/Z movement if valid
            player.position.x += moveX;
            player.position.z += moveZ;

            player.rotation.y = playerAngle;

            // Simple Walk Animation (Bobbing)
            if (isMoving && isGrounded) {
                walkCycle += delta * 10;
                player.position.y += Math.sin(walkCycle) * 0.1;
            }

            // Camera Follow
            const camOffset = { x: Math.sin(playerAngle) * 20, y: 12, z: Math.cos(playerAngle) * 20 };
            camera.position.x += (player.position.x + camOffset.x - camera.position.x) * 0.1;
            camera.position.y += (player.position.y + camOffset.y - camera.position.y) * 0.1;
            camera.position.z += (player.position.z + camOffset.z - camera.position.z) * 0.1;
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
